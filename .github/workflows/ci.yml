name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check translations
        run: |
          python3 scripts/check_strings.py
          plutil -lint Localization/*.lproj/Localizable.strings
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # liberty-check mirrors the same assertions without XCTest, so work can be
      # verified on a machine with no Xcode. Running it here too means the two
      # copies cannot drift apart unnoticed.
      - name: Test without XCTest
        run: swift run liberty-check
      - name: Bundle app
        run: scripts/bundle.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LibertyLoader
          path: |
            build/LibertyLoader.dmg
            build/LibertyLoader.zip
