name: Release

# Push a tag like v0.2.0 to publish a release with the .dmg (for new installs)
# and .zip (for the app's built-in updater).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Test
        run: swift test
      - name: Bundle app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh --dmg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/LibertyLoader.dmg
            build/LibertyLoader.zip
